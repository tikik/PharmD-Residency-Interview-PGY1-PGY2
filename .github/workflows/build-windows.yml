name: Build Windows Executable

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Chroma DB
        run: python ingest_pdfs.py

      - name: Build executable
        run: pyinstaller run_app.spec

      - name: Create clean distribution folder
        run: |
          mkdir release_dist
          copy dist\Start_Interview.exe release_dist\
          xcopy chroma_db release_dist\chroma_db\ /E /I
          xcopy data release_dist\data\ /E /I
          copy instructions.txt release_dist\

      - name: Create ZIP
        run: Compress-Archive -Path release_dist -DestinationPath InterviewApp_Windows.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: InterviewApp_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
